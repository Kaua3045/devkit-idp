services:
  postgres:
    container_name: devkit-idp-postgres
    image: postgres:latest
    restart: on-failure
    environment:
      - POSTGRES_DB=devkit-idp-platform
      - POSTGRES_PASSWORD=123456
      - POSTGRES_ROOT_HOST=%
    ports:
      - "5434:5432"
    networks:
      - devkit-idp-platform-network

networks:
  devkit-idp-platform-network: